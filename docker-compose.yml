services:
  n3d-catalog:
    build: .
    container_name: n3d-catalog
    restart: unless-stopped
    ports:
      - "8090:3000"
    environment:
      N3D_API_KEY: ${N3D_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      # set to "true" once this is served over HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # email (quote PDFs to the customer and to you)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # Square
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN}
      SQUARE_ENV: ${SQUARE_ENV:-production}
      # Spoolman (optional): your instance's base URL, no trailing slash
      SPOOLMAN_URL: ${SPOOLMAN_URL}
    volumes:
      - n3d_catalog_data:/app/data

volumes:
  n3d_catalog_data:

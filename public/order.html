<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, noai, noimageai">
<title>Your order</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<script src="/assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/store.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/" aria-label="Home">
    <img class="logo logo-light" id="logo-light" alt="" hidden>
    <img class="logo logo-dark" id="logo-dark" alt="" hidden>
    <span id="brand">Design Catalog</span>
  </a>
  <div class="topbar-actions">
    <button class="btn ghost theme-toggle" data-theme-toggle type="button" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <a class="btn primary" href="/">Keep shopping</a>
  </div>
</header>

<main class="order-page">
  <div class="order-card" id="order" aria-live="polite">
    <p class="muted">Loading your order…</p>
  </div>
</main>

<script src="/assets/order.js"></script>
</body>
</html>

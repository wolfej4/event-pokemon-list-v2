<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design Catalog</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<script src="/assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/store.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/" aria-label="Home">
    <img class="logo logo-light" id="logo-light" alt="" hidden>
    <img class="logo logo-dark" id="logo-dark" alt="" hidden>
    <span id="brand">Design Catalog</span>
  </a>
  <div class="topbar-actions">
    <button class="btn ghost theme-toggle" data-theme-toggle type="button" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="btn primary" id="open-quote" type="button">
      Your quote <span class="count" id="quote-count">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <h1 id="hero-title">Design Catalog</h1>
  <p id="hero-tagline"></p>
  <div class="search-row">
    <label class="sr-only" for="search">Search designs</label>
    <input id="search" class="input" type="search" placeholder="Search by name, type, or Pokédex number" autocomplete="off">
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by category">
    <button class="chip active" data-cat="all" type="button">All</button>
    <button class="chip" data-cat="character" type="button">Characters</button>
    <button class="chip" data-cat="standard" type="button">Standard</button>
    <button class="chip" data-cat="model" type="button">Extras</button>
  </div>
</section>

<main>
  <p id="result-count" class="result-count" aria-live="polite"></p>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <p>No designs match that search.</p>
    <button class="btn" id="clear-filters" type="button">Clear search</button>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<!-- design detail -->
<div class="overlay" id="detail" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title" id="detail-body"></div>
</div>

<!-- quote drawer -->
<div class="overlay drawer-overlay" id="drawer" hidden>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h2 id="drawer-title">Your quote</h2>
      <button class="btn ghost small" id="close-drawer" type="button">Close</button>
    </div>
    <div id="drawer-content"></div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/assets/store.js"></script>
</body>
</html>

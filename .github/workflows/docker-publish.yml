name: Build and publish Docker image

# Builds the image from the Dockerfile in this repo and pushes it to GitHub
# Container Registry, so deployment targets (Unraid, Portainer, etc.) can
# just pull a ready image with `image: ghcr.io/...` instead of building on
# the target machine — no source tree or build-context path to get wrong.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/event-pokemon-list:latest
            ghcr.io/${{ github.repository_owner }}/event-pokemon-list:${{ github.sha }}

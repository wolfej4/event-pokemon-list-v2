services:
  n3d-catalog:
    # Points at an explicit path rather than "." on purpose — Compose
    # Manager stores the stack file itself under
    # /boot/config/plugins/compose.manager/projects/<name>/, which is NOT
    # where you want the repo. Clone/copy the whole repo (Dockerfile, src/,
    # public/, admin/, package.json, etc.) to the path below first — if
    # "failed to read dockerfile: open Dockerfile: no such file or
    # directory" shows up, that's what's missing: this path doesn't have
    # the repo in it yet. Change the path here if you put it somewhere
    # else. If you'd rather not build on the NAS at all, push an image to
    # a registry and swap this whole `build:` block for
    # `image: yourregistry/n3d-catalog:latest`.
    build:
      context: /mnt/user/appdata/n3d-catalog/src
      dockerfile: Dockerfile
    container_name: n3d-catalog
    restart: unless-stopped
    ports:
      - "8090:3000"
    environment:
      PORT: "3000"
      N3D_API_KEY: ${N3D_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      # Leave "false" unless /admin is reached ONLY over HTTPS (a reverse
      # proxy / Cloudflare Tunnel in front of it). Setting this "true" while
      # you're still hitting it over plain http://<unraid-ip>:8090 breaks
      # admin login — every request 401s right after logging in, because
      # the browser won't store a Secure cookie over an insecure connection.
      COOKIE_SECURE: "false"
      # SMTP — leave the .env values blank to disable emailed PDF quotes
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      # Square catalog push — leave the .env values blank to disable
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-}
    volumes:
      # Bind-mounted into appdata (rather than a named volume) so it shows
      # up under Unraid's normal appdata share — visible in the file
      # manager and picked up automatically by the CA Backup/Restore
      # plugin. Create this folder first, or let Docker create it as root
      # on first run.
      - /mnt/user/appdata/n3d-catalog:/app/data
    labels:
      # Purely cosmetic: lets Unraid show a WebUI link/icon for this
      # container on the main Docker tab, same as native-template apps.
      # The icon is served by the app itself once it's up.
      net.unraid.docker.webui: "http://[IP]:[PORT:8090]/admin"
      net.unraid.docker.icon: "http://[IP]:[PORT:8090]/assets/icon-512.png"
